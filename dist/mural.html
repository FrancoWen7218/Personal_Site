<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Franco — IP 涂鸦墙</title><style>*{box-sizing:border-box}html,body{margin:0;background:#282923;color:#eee;font-family:Arial,sans-serif}.view{width:100%;height:100svh;display:flex;align-items:center;justify-content:center;overflow:auto}.view img{width:100%;height:100%;object-fit:contain;display:block}.zoom .view{display:block}.zoom .view img{width:max(1800px,150vw);height:auto;max-width:none;object-fit:initial}nav{position:fixed;z-index:2;top:16px;left:18px;display:flex;gap:5px;padding:4px;background:#f3f1e6ed;border-radius:9px}button{background:none;border:0;padding:10px 14px;color:#262820;border-radius:6px;cursor:pointer;font-size:12px}button.active{background:#282923;color:white}button:focus-visible{outline:2px solid #87877c;outline-offset:2px}@media(max-width:600px){nav{top:10px;left:10px}button{padding:9px 12px}}</style></head><body><nav aria-label="预览方式"><button id="full" class="active">全景</button><button id="detail">放大看掉漆细节</button></nav><main class="view"><img src="assets/ip-mural-v1.png" alt="Franco 与用户喜欢的角色组成的做旧涂鸦墙，小木乃伊从右下洞口探头"></main><script>const full=document.querySelector('#full'),detail=document.querySelector('#detail');full.onclick=()=>{document.body.classList.remove('zoom');full.classList.add('active');detail.classList.remove('active')};detail.onclick=()=>{document.body.classList.add('zoom');detail.classList.add('active');full.classList.remove('active')};</script></body></html>
