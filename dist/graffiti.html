<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Franco — 街头涂鸦</title><style>*{box-sizing:border-box}body{margin:0;background:#787669;font-family:Arial,sans-serif;overflow:hidden}.scene{height:100svh;position:relative;background:url('assets/ip-mural-v1.png') center bottom/cover}.piece{position:absolute;left:7%;top:12%;width:86%;height:62%;object-fit:contain;filter:none}nav{position:fixed;z-index:2;top:20px;left:22px;background:#f6f4eee8;border-radius:10px;padding:4px;display:flex;gap:4px}button{border:0;background:none;padding:10px 14px;border-radius:7px;cursor:pointer;color:#292b24;font-size:12px}button.active{background:#282a23;color:white}button:focus-visible{outline:2px solid #7c7e71;outline-offset:3px}.plain .scene{background:#dedcd5}.plain .piece{top:14%;height:72%}@media(max-width:600px){.scene{background-position:85% bottom}.piece{left:3%;width:94%;top:18%;height:46%}nav{left:12px;top:12px}}.scene>.piece{visibility:hidden}.plain .scene>.piece{visibility:visible}</style></head><body><nav aria-label="展示方式"><button class="active" id="wall">上墙效果</button><button id="plain">原始字形</button></nav><main class="scene"><img class="piece" src="assets/lettering/franco-graffiti-v1.png" alt="黑色 FRANCO 街头涂鸦，白色短划线与局部亮面反光，无滴落"></main><script>const wall=document.querySelector('#wall'),plain=document.querySelector('#plain');wall.onclick=()=>{document.body.classList.remove('plain');wall.classList.add('active');plain.classList.remove('active')};plain.onclick=()=>{document.body.classList.add('plain');plain.classList.add('active');wall.classList.remove('active')};</script></body></html>
